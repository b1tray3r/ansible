---

- hosts: gpu_group
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    # ponytail: R9700 is 2025 hardware; Ubuntu 24.04 GA kernel (6.8) and
    # its pinned linux-firmware snapshot (2024-03) both predate it, so
    # amdgpu fails to probe the card ("Fatal error during GPU init").
    # The HWE kernel stack pulls a current kernel + matching firmware.
    - name: Install HWE kernel stack (current kernel + firmware for new GPUs)
      ansible.builtin.apt:
        name: linux-generic-hwe-24.04
        state: present
        install_recommends: true
      register: hwe_install

    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot to boot into the new kernel
      ansible.builtin.reboot:
        reboot_timeout: 300
      when: hwe_install.changed or reboot_required.stat.exists

    - name: Check GPU probe status after reboot
      ansible.builtin.shell:
        cmd: "dmesg | grep -i amdgpu | tail -10; lspci -k | grep -iA3 '\\[030[02]\\]'"
      register: gpu_check
      changed_when: false
      failed_when: false

    - name: Show GPU probe status
      ansible.builtin.debug:
        msg: "{{ gpu_check.stdout_lines }}"

    # ponytail: /dev/dri/card* and renderD* are group video/render —
    # without membership the connecting user can't open the device at all
    # (nvtop, vulkaninfo, etc. silently show no GPU rather than erroring).
    - name: Add connecting user to video/render groups (GPU device access)
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: video,render
        append: true

    # ponytail: default runpm=auto lets the card idle into BACO suspend,
    # which makes gpu_busy_percent (and anything polling it, incl. nvtop)
    # return EBUSY until something wakes it. Worked out of the box on
    # Pop!_OS (different runpm default); disabling it here matches that.
    - name: Disable amdgpu runtime power management
      ansible.builtin.copy:
        content: "options amdgpu runpm=0\n"
        dest: /etc/modprobe.d/amdgpu-no-runpm.conf
        mode: "0644"
      register: runpm_conf

    - name: Rebuild initramfs if runpm setting changed
      ansible.builtin.command: update-initramfs -u
      when: runpm_conf.changed

    - name: Force GPU power control to "on" now (no reboot needed)
      ansible.builtin.shell:
        cmd: "echo on > /sys/bus/pci/devices/0000:03:00.0/power/control"
      changed_when: false
      failed_when: false
