services:
  redis:
    image: redis:7-alpine
    networks:
      - internal
    restart: unless-stopped

  db:
    image: postgres:15
    volumes:
      - paperless_db:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=paperless
      - POSTGRES_USER={{ PAPERLESS_DB_USER }}
      - POSTGRES_PASSWORD={{ PAPERLESS_DB_PASSWORD }}
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ PAPERLESS_DB_USER }}"]
      interval: 10s
      timeout: 5s
      retries: 5

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    depends_on:
      - db
      - redis
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      - paperless_export:/usr/src/paperless/export
      - paperless_consume:/usr/src/paperless/consume
    env_file:
      - .env
    environment:
      - PAPERLESS_REDIS=redis://redis:6379
      - PAPERLESS_DBHOST=db
      - PAPERLESS_DBNAME=paperless
      - PAPERLESS_DBUSER={{ PAPERLESS_DB_USER }}
      - PAPERLESS_DBPASS={{ PAPERLESS_DB_PASSWORD }}
      - PAPERLESS_SECRET_KEY={{ PAPERLESS_SECRET_KEY }}
      - PAPERLESS_OCR_LANGUAGE=deu+eng
      - PAPERLESS_TIME_ZONE=Europe/Berlin
      - PAPERLESS_CSRF_TRUSTED_ORIGINS=https://{{ PAPERLESS_DOMAIN }}
      - PAPERLESS_OCR_ROTATE_PAGES=true
      - PAPERLESS_CONSUMER_DELETE_DUPLICATES=true
      - PAPERLESS_EXPORT_FOLDER=/usr/src/paperless/export
    networks:
      - proxy
      - internal
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.paperless.entrypoints=websecure"
      - "traefik.http.routers.paperless.rule=Host(`{{ PAPERLESS_DOMAIN }}`)"
      - "traefik.http.routers.paperless.tls.certresolver=letsencrypt"
      - "traefik.http.services.paperless.loadbalancer.server.port=8000"
      - "traefik.http.services.paperless.loadbalancer.server.scheme=http"

volumes:
  paperless_data:
  paperless_media:
  paperless_export:
  paperless_consume:
  paperless_db:

networks:
  proxy:
    external: true
  internal:
    driver: bridge