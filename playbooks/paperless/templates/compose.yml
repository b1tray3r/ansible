volumes:
  paperless_data:
  paperless_media:
  paperless_export:
  paperless_consume:
  paperless_db:

networks:
  proxy:
    external: true
  internal:
    driver: overlay

secrets:
  paperless_db_user_{{ paperless_db_user_hash }}:
    file: "{{ PAPERLESS_DATA_PATH }}/secrets/paperless_db_user.txt"
  paperless_db_password_{{ paperless_db_password_hash }}:
    file: "{{ PAPERLESS_DATA_PATH }}/secrets/paperless_db_password.txt"
  paperless_secret_key_{{ paperless_secret_key_hash }}:
    file: "{{ PAPERLESS_DATA_PATH }}/secrets/paperless_secret_key.txt"
  rclone_config_{{ rclone_config_hash }}:
    file: "{{ PAPERLESS_DATA_PATH }}/secrets/rclone.conf"

configs:
  paperless_rclone_script_{{ rclone_script_hash }}:
    file: "{{ PAPERLESS_DATA_PATH }}/secrets/rclone.sh"
  paperless_export_script_{{ paperless_export_script_hash }}:
    file: "{{ PAPERLESS_DATA_PATH }}/secrets/export.sh"
