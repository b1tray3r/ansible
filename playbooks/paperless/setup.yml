---

- hosts: paperless_group
  remote_user: root
  tasks:
    - name: Copy configuration templates
      ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ PAPERLESS_DATA_PATH }}/{{ item }}"
        owner: root
        group: root
        mode: 0644
      with_items:
        - compose.yml
        - compose.rclone.yml
        - rclone.conf

    - name: Copy environment file
      ansible.builtin.copy:
        src: ".env"
        dest: "{{ PAPERLESS_DATA_PATH }}/.env"
        owner: root
        group: root
        mode: 0644

    - name: Deploy paperless via docker compose
      community.docker.docker_compose_v2:
        project_src: "{{ PAPERLESS_DATA_PATH }}"
        state: restarted
        recreate: always

    - name: Copy exporter service file
      ansible.builtin.copy:
        src: "export.service"
        dest: "/etc/systemd/system/paperless-document-exporter.service"
        owner: root
        group: root
        mode: 0755

    - name: Copy exporter timer file
      ansible.builtin.template:
        src: "export.timer"
        dest: "/etc/systemd/system/paperless-document-exporter.timer"
        owner: root
        group: root
        mode: 0644

    - name: Create systemd service for paperless document exporter
      ansible.builtin.systemd:
        name: paperless-document-exporter
        daemon_reload: true
        enabled: true
        state: started

    - name: Create systemd timer for paperless document exporter
      ansible.builtin.systemd:
        name: paperless-document-exporter.timer
        daemon_reload: true
        enabled: true
        state: started
      
    - name: Notify completion
      ansible.builtin.shell:
        cmd: "curl -s --max-time 10 -u {{ NTFY_ABORGARDT_USER }}:{{ NTFY_ABORGARDT_PASSWORD }} -H 'Title: Paperless Setup Complete' -H 'Tags: white_check_mark' -d 'Paperless playbook completed successfully on {{ inventory_hostname }}' https://{{ NTFY_HOST }}/{{ NTFY_TOPIC_ANSIBLE }}"
      register: ntfy_result
      failed_when: false
      changed_when: false
      delegate_to: localhost
      become: false
