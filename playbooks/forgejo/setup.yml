---

- hosts: forgejo_group
  remote_user: root
  tasks:
    - name: Setup git user for SSH passthrough
      block:
        - name: Create git user
          ansible.builtin.user:
            name: git
            comment: "Git Version Control"
            shell: /bin/bash
            createhome: yes
            home: /home/git
            system: no
            groups: docker
            append: yes

        - name: Ensure git user .ssh directory exists
          ansible.builtin.file:
            path: /home/git/.ssh
            state: directory
            owner: git
            group: git
            mode: "0700"

    - name: Create directory structure
      block:
        - name: Ensure forgejo root folder exists
          ansible.builtin.file:
            path: "{{ FORGEJO_DATA_PATH }}"
            state: directory
            mode: "0750"

        - name: Ensure forgejo data folder exists
          ansible.builtin.file:
            path: "{{ FORGEJO_DATA_PATH }}/forgejo"
            state: directory
            mode: "0750"
            owner: "1000"
            group: "1000"

        - name: Ensure forgejo git storage folder exists
          ansible.builtin.file:
            path: "{{ FORGEJO_DATA_PATH }}/forgejo/git"
            state: directory
            owner: "1000"
            group: "1000"
            mode: "0750"

        - name: Ensure forgejo repository root exists
          ansible.builtin.file:
            path: "{{ FORGEJO_DATA_PATH }}/forgejo/git/repositories"
            state: directory
            owner: "1000"
            group: "1000"
            mode: "0750"

        - name: Ensure forgejo LFS root exists
          ansible.builtin.file:
            path: "{{ FORGEJO_DATA_PATH }}/forgejo/git/lfs"
            state: directory
            owner: "1000"
            group: "1000"
            mode: "0750"

        - name: Ensure forgejo internal ssh folder exists
          ansible.builtin.file:
            path: "{{ FORGEJO_DATA_PATH }}/forgejo/git/.ssh"
            state: directory
            owner: "1000"
            group: "1000"
            mode: "0700"

        - name: Ensure forgejo authorized_keys file exists
          ansible.builtin.file:
            path: "{{ FORGEJO_DATA_PATH }}/forgejo/git/.ssh/authorized_keys"
            state: touch
            owner: "1000"
            group: "1000"
            mode: "0600"

        - name: Ensure forgejo .ssh folder exists
          ansible.builtin.file:
            path: "{{ FORGEJO_DATA_PATH }}/forgejo/.ssh"
            state: directory
            owner: "1000"
            group: "1000"
            mode: "0700"

        - name: Ensure mysql data folder exists
          ansible.builtin.file:
            path: "{{ FORGEJO_DATA_PATH }}/mysql"
            state: directory
            mode: "0750"

    - name: Deploy Forgejo stack
      block:
        - name: Ensure proxy network exists
          community.docker.docker_network:
            name: proxy
            driver: bridge
            attachable: true
            state: present

        - name: Ensure gitea conf directory exists
          ansible.builtin.file:
            path: "{{ FORGEJO_DATA_PATH }}/forgejo/gitea/conf"
            state: directory
            owner: "1000"
            group: "1000"
            mode: "0755"

        - name: Ensure gitea log directory exists
          ansible.builtin.file:
            path: "{{ FORGEJO_DATA_PATH }}/forgejo/gitea/log"
            state: directory
            owner: "1000"
            group: "1000"
            mode: "0755"

        - name: Deploy app.ini configuration
          ansible.builtin.template:
            src: "templates/app.ini.j2"
            dest: "{{ FORGEJO_DATA_PATH }}/forgejo/gitea/conf/app.ini"
            owner: "1000"
            group: "1000"
            mode: "0644"
          notify: Restart forgejo stack

        - name: Copy compose template
          ansible.builtin.template:
            src: "templates/compose.yml"
            dest: "{{ FORGEJO_DATA_PATH }}/compose.yml"
            owner: root
            group: root
            mode: 0644

        - name: Remove existing forgejo stack
          community.docker.docker_compose_v2:
            project_src: "{{ FORGEJO_DATA_PATH }}"
            project_name: forgejo
            state: absent

        - name: Wait for stack to stop
          ansible.builtin.pause:
            seconds: 10

        - name: Start forgejo stack
          community.docker.docker_compose_v2:
            project_name: forgejo
            project_src: "{{ FORGEJO_DATA_PATH }}"
            state: present

    - name: Initialize Forgejo database
      block:
        - name: Set forgejo container name
          ansible.builtin.set_fact:
            forgejo_container: "forgejo_forgejo"

        - name: Check if already initialized
          ansible.builtin.stat:
            path: "{{ FORGEJO_DATA_PATH }}/forgejo/.initialized"
          register: init_check

        - name: Run database migration
          when:
            - forgejo_container is defined
            - not init_check.stat.exists
          block:
            - name: Wait for database hostname to resolve
              community.docker.docker_container_exec:
                container: "{{ forgejo_container }}"
                command: "/bin/sh -c 'getent hosts db || nslookup db || ping -c 1 db'"
              register: db_resolve_result
              until: db_resolve_result.rc == 0
              retries: 30
              delay: 2

            - name: Wait for database port to be accessible
              community.docker.docker_container_exec:
                container: "{{ forgejo_container }}"
                command: "/bin/sh -c 'timeout 5 bash -c \"</dev/tcp/db/3306\" 2>/dev/null || nc -zv db 3306 2>&1 || telnet db 3306 2>&1 | grep -q Connected'"
              register: db_port_result
              until: db_port_result.rc == 0
              retries: 30
              delay: 2
              ignore_errors: yes

            - name: Run gitea migrate
              community.docker.docker_container_exec:
                container: "{{ forgejo_container }}"
                command: "gitea migrate"
              register: migrate_result
              failed_when: migrate_result.rc != 0 and 'already initialized' not in migrate_result.stderr

            - name: Wait for database to be ready
              community.docker.docker_container_exec:
                container: "{{ forgejo_container }}"
                command: "gitea admin user list"
              register: db_ready_result
              until: db_ready_result.rc == 0
              retries: 30
              delay: 2

            - name: Check if admin user exists
              community.docker.docker_container_exec:
                container: "{{ forgejo_container }}"
                command: "gitea admin user list --admin"
              register: admin_check
              changed_when: false

            - name: Create admin user
              when: "FORGEJO_ADMIN_USERNAME | default('admin') not in admin_check.stdout"
              community.docker.docker_container_exec:
                container: "{{ forgejo_container }}"
                command: "gitea admin user create --admin --username {{ FORGEJO_ADMIN_USERNAME | default('admin') }} --password {{ FORGEJO_ADMIN_PASSWORD | default('changeme') }} --email {{ FORGEJO_ADMIN_EMAIL | default('admin@borgardt.me') }} --must-change-password=false"

            - name: Create initialization marker
              ansible.builtin.file:
                path: "{{ FORGEJO_DATA_PATH }}/forgejo/.initialized"
                state: touch
                mode: "0644"
      rescue:
        - name: Log initialization failure
          ansible.builtin.debug:
            msg: "Forgejo initialization failed - container may not be ready yet"

    - name: Install scheduled Forgejo backup job
      block:
        - name: Install Forgejo backup script
          ansible.builtin.template:
            src: "templates/backup.sh.j2"
            dest: "/usr/local/sbin/forgejo-backup.sh"
            owner: root
            group: root
            mode: "0700"

        - name: Install Forgejo backup systemd service
          ansible.builtin.template:
            src: "templates/forgejo-backup.service.j2"
            dest: "/etc/systemd/system/forgejo-backup.service"
            owner: root
            group: root
            mode: "0644"

        - name: Install Forgejo backup systemd timer
          ansible.builtin.template:
            src: "templates/forgejo-backup.timer.j2"
            dest: "/etc/systemd/system/forgejo-backup.timer"
            owner: root
            group: root
            mode: "0644"

        - name: Reload systemd daemon
          ansible.builtin.systemd_service:
            daemon_reload: true
          when: not ansible_check_mode

        - name: Enable and start Forgejo backup timer
          ansible.builtin.systemd_service:
            name: forgejo-backup.timer
            enabled: true
            state: started
          when: not ansible_check_mode

  handlers:
    - name: Restart forgejo stack
      community.docker.docker_compose_v2:
        project_src: "{{ FORGEJO_DATA_PATH }}"
        project_name: forgejo
        state: restarted
