---

- hosts: forgejo_group
  remote_user: root
  gather_facts: true
  vars:
    forgejo_backup_run_path: "{{ FORGEJO_BACKUP_PATH }}/{{ ansible_facts['date_time']['iso8601'] }}"
    forgejo_backup_archive_path: "{{ FORGEJO_BACKUP_PATH }}/forgejo-backup-{{ ansible_facts['date_time']['iso8601'] }}.tar.gz"
  tasks:
    - name: Ensure backup root directory exists
      ansible.builtin.file:
        mode: "0750"
        path: "{{ FORGEJO_BACKUP_PATH }}"
        state: directory

    - name: Create backup directory
      ansible.builtin.file:
        mode: "0750"
        path: "{{ forgejo_backup_run_path }}"
        state: directory

    - name: Remove previous Forgejo dump archive from container
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --user
          - git
          - forgejo_forgejo
          - rm
          - -f
          - /tmp/forgejo-dump.zip

    - name: Create native Forgejo dump archive
      ansible.builtin.shell: >-
        docker exec --user git forgejo_forgejo bash --noprofile --norc -lc
        'forgejo dump -c /data/gitea/conf/app.ini -w /data -f /tmp/forgejo-dump.zip -t /tmp'

    - name: Copy Forgejo dump archive from container
      ansible.builtin.command:
        argv:
          - docker
          - cp
          - forgejo_forgejo:/tmp/forgejo-dump.zip
          - "{{ forgejo_backup_run_path }}/forgejo-dump.zip"

    - name: Read Forgejo dump archive size
      ansible.builtin.stat:
        path: "{{ forgejo_backup_run_path }}/forgejo-dump.zip"
      register: forgejo_dump_archive

    - name: Assert Forgejo dump archive is large enough
      ansible.builtin.assert:
        that:
          - forgejo_dump_archive.stat.exists
          - forgejo_dump_archive.stat.size | int >= FORGEJO_BACKUP_MIN_SIZE_BYTES | int
        fail_msg: >-
          Forgejo dump archive is smaller than expected:
          {{ forgejo_dump_archive.stat.size | default(0) }} bytes <
          {{ FORGEJO_BACKUP_MIN_SIZE_BYTES }} bytes.

    - name: Remove temporary Forgejo dump archive from container
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - --user
          - git
          - forgejo_forgejo
          - rm
          - -f
          - /tmp/forgejo-dump.zip

    - name: Copy app.ini to backup
      ansible.builtin.copy:
        dest: "{{ forgejo_backup_run_path }}/app.ini"
        mode: "0640"
        remote_src: true
        src: "{{ FORGEJO_DATA_PATH }}/forgejo/gitea/conf/app.ini"

    - name: Remove previous SQL dump from container
      community.docker.docker_container_exec:
        container: forgejo_db
        command: "sh -c 'rm -f /tmp/forgejo-db.sql'"

    - name: Create SQL dump in database container
      community.docker.docker_container_exec:
        container: forgejo_db
        command: >-
          sh -c 'mariadb-dump
          --user={{ FORGEJO_MYSQL_ROOT_USER }}
          --password={{ FORGEJO_MYSQL_ROOT_PASSWORD }}
          --single-transaction
          --quick
          --routines
          --events
          --triggers
          forgejo > /tmp/forgejo-db.sql'

    - name: Copy SQL dump from container
      ansible.builtin.command:
        argv:
          - docker
          - cp
          - forgejo_db:/tmp/forgejo-db.sql
          - "{{ forgejo_backup_run_path }}/forgejo-db.sql"

    - name: Remove SQL dump from container
      community.docker.docker_container_exec:
        container: forgejo_db
        command: "sh -c 'rm -f /tmp/forgejo-db.sql'"

    - name: Create compressed backup archive
      ansible.builtin.archive:
        path:
          - "{{ forgejo_backup_run_path }}/forgejo-dump.zip"
          - "{{ forgejo_backup_run_path }}/app.ini"
          - "{{ forgejo_backup_run_path }}/forgejo-db.sql"
        dest: "{{ forgejo_backup_archive_path }}"
        format: gz
        remove: true

    - name: Remove temporary backup directory
      ansible.builtin.file:
        path: "{{ forgejo_backup_run_path }}"
        state: absent

    - name: List existing backup archives
      ansible.builtin.find:
        paths: "{{ FORGEJO_BACKUP_PATH }}"
        patterns: "forgejo-backup-*.tar.gz"
        file_type: file
        recurse: false
      register: forgejo_backup_archives

    - name: Remove old backup archives
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: >-
        {{ forgejo_backup_archives.files | sort(attribute='mtime', reverse=true) }}
      loop_control:
        index_var: forgejo_backup_archive_index
      when:
        - forgejo_backup_archives.matched | int > FORGEJO_BACKUP_RETENTION_DAYS | int
        - forgejo_backup_archive_index >= FORGEJO_BACKUP_RETENTION_DAYS | int
