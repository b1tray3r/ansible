  forgejo:
    image: codeberg.org/forgejo/forgejo:14
    container_name: forgejo_forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
    restart: unless-stopped
    volumes:
      - {{ FORGEJO_DATA_PATH }}/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - internal
      - proxy
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:3000 -O - | grep -Eo 'Forgejo' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.forgejo.rule=Host(`{{ FORGEJO_DOMAIN }}`)"
      - "traefik.http.routers.forgejo.entrypoints=websecure"
      - "traefik.http.routers.forgejo.tls.certresolver=letsencrypt"
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"


  db:
    image: mysql:8
    container_name: forgejo_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=forgejo
      - MYSQL_USER=forgejo
      - MYSQL_PASSWORD=forgejo
      - MYSQL_DATABASE=forgejo
    networks:
      - internal
    volumes:
      - {{ FORGEJO_DATA_PATH }}/mysql:/var/lib/mysql
