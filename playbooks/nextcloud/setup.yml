---

- hosts: nextcloud_group
  remote_user: root
  tasks:
    - name: Ensure nextcloud folder exists
      ansible.builtin.file:
        path: "{{ NEXTCLOUD_DATA_PATH }}"
        state: directory
        mode: "0750"

    - name: Ensure proxy network exists
      ansible.builtin.include_tasks: ../tasks/ensure-proxy-network.yml

    - name: Copy .env file
      ansible.builtin.template:
        src: ".env.j2"
        dest: "{{ NEXTCLOUD_DATA_PATH }}/.env"
        owner: root
        group: root
        mode: 0600

    - name: Copy configuration templates
      ansible.builtin.template:
        src: "compose.yml"
        dest: "{{ NEXTCLOUD_DATA_PATH }}/compose.yml"
        owner: root
        group: root
        mode: 0644

    - name: Start nextcloud stack
      community.docker.docker_compose_v2:
        project_name: nextcloud
        project_src: "{{ NEXTCLOUD_DATA_PATH }}"
        state: present

    - name: Wait for Nextcloud to be ready
      ansible.builtin.wait_for:
        timeout: 30

    - name: Get nextcloud container
      ansible.builtin.shell:
        cmd: "docker ps --filter 'name=nextcloud_app' --format '{{ '{{' }}.ID{{ '}}' }}'"
      register: nc_container_raw
      changed_when: false

    - name: Set nextcloud container fact
      when: "nc_container_raw.stdout_lines | length > 0"
      ansible.builtin.set_fact:
        nextcloud_container_id: "{{ nc_container_raw.stdout_lines[0] }}"

    - name: Install and enable fulltextsearch apps
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      ansible.builtin.include_tasks: tasks/fulltextsearch-app.yml
      loop:
        - fulltextsearch
        - fulltextsearch_elasticsearch
        - files_fulltextsearch
      loop_control:
        loop_var: ft_app

    - name: Set search platform config
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ config:app:set fulltextsearch search_platform --value=\"OCA\\\\FullTextSearch_Elasticsearch\\\\Platform\\\\ElasticSearchPlatform\""
        chdir: /var/www/html
      register: occ_set_platform
      changed_when: "'now' in occ_set_platform.stdout or 'Set' in occ_set_platform.stdout"

    - name: Set elasticsearch host config
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ config:app:set fulltextsearch_elasticsearch elastic_host --value=\"http://elasticsearch:9200\""
        chdir: /var/www/html
      register: occ_set_es_host
      changed_when: "'now' in occ_set_es_host.stdout or 'Set' in occ_set_es_host.stdout"

    - name: Set elasticsearch index config
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ config:app:set fulltextsearch_elasticsearch elastic_index --value=\"nextcloud\""
        chdir: /var/www/html
      register: occ_set_es_index
      changed_when: "'now' in occ_set_es_index.stdout or 'Set' in occ_set_es_index.stdout"

    - name: Test fulltextsearch configuration
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ fulltextsearch:test"
        chdir: /var/www/html
      register: occ_fulltextsearch_test
      failed_when: false
      changed_when: false

    - name: Show fulltextsearch test results
      ansible.builtin.debug:
        msg: "{{ occ_fulltextsearch_test.stdout }}"

    - name: Index all documents with fulltextsearch
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ fulltextsearch:index --no-readline"
        chdir: /var/www/html
      register: occ_fulltextsearch_index
      failed_when: false
      changed_when: true

    - name: Show indexing results
      ansible.builtin.debug:
        msg: "Fulltextsearch indexing completed. Check Nextcloud UI for search functionality."

    - name: Configure Elasticsearch highlight max offset
      ansible.builtin.shell:
        command: |
          docker exec nextcloud_elasticsearch curl -s -XPUT 'localhost:9200/nextcloud/_settings' -H 'Content-Type: application/json' -d '{"index":{"highlight.max_analyzed_offset":999999}}'
      failed_when: false
      changed_when: false

    - name: Configure Elasticsearch replicas for single-node cluster
      ansible.builtin.shell:
        command: |
          docker exec nextcloud_elasticsearch curl -s -XPUT 'localhost:9200/nextcloud/_settings' -H 'Content-Type: application/json' -d '{"index":{"number_of_replicas":0}}'
      failed_when: false
      changed_when: false

    - name: Reset fulltextsearch index to clear stale file references
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ fulltextsearch:reset --no-readline"
        chdir: /var/www/html
      register: occ_fulltextsearch_reset
      failed_when: false
      changed_when: true

    - name: Re-index documents after fulltextsearch reset
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ fulltextsearch:index --no-readline"
        chdir: /var/www/html
      register: occ_fulltextsearch_reindex
      failed_when: false
      changed_when: true

    - name: Notify completion
      ansible.builtin.include_tasks: ../tasks/notify-ntfy.yml
      vars:
        notify_service: "Nextcloud"
