---

- hosts: nextcloud_group
  remote_user: root
  tasks:
    - name: Ensure nextcloud folder exists
      ansible.builtin.file:
        path: "{{ NEXTCLOUD_DATA_PATH }}"
        state: directory
        mode: "0750"

    - name: Ensure proxy network exists
      community.docker.docker_network:
        name: proxy
        driver: bridge
        attachable: true
        state: present

    - name: Copy .env file
      ansible.builtin.template:
        src: ".env.j2"
        dest: "{{ NEXTCLOUD_DATA_PATH }}/.env"
        owner: root
        group: root
        mode: 0600

    - name: Copy configuration templates
      ansible.builtin.template:
        src: "compose.yml"
        dest: "{{ NEXTCLOUD_DATA_PATH }}/compose.yml"
        owner: root
        group: root
        mode: 0644

    - name: Start nextcloud stack
      community.docker.docker_compose_v2:
        project_name: nextcloud
        project_src: "{{ NEXTCLOUD_DATA_PATH }}"
        state: present

    - name: Wait for Nextcloud to be ready
      ansible.builtin.wait_for:
        timeout: 30

    - name: Get nextcloud container
      ansible.builtin.shell:
        cmd: "docker ps --filter 'name=nextcloud_app' --format '{{ '{{' }}.ID{{ '}}' }}'"
      register: nc_container_raw
      changed_when: false

    - name: Set nextcloud container fact
      when: "nc_container_raw.stdout_lines | length > 0"
      ansible.builtin.set_fact:
        nextcloud_container_id: "{{ nc_container_raw.stdout_lines[0] }}"

    - name: Install fulltextsearch app
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ app:install fulltextsearch"
        chdir: /var/www/html
      register: occ_install_fulltextsearch
      failed_when: false
      changed_when: "'installed' in occ_install_fulltextsearch.stdout or 'enabled' in occ_install_fulltextsearch.stdout"

    - name: Enable fulltextsearch app
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ app:enable fulltextsearch"
        chdir: /var/www/html
      register: occ_enable_fulltextsearch
      failed_when: false
      changed_when: true

    - name: Install fulltextsearch_elasticsearch app
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ app:install fulltextsearch_elasticsearch"
        chdir: /var/www/html
      register: occ_install_elasticsearch
      failed_when: false
      changed_when: "'installed' in occ_install_elasticsearch.stdout or 'enabled' in occ_install_elasticsearch.stdout"

    - name: Enable fulltextsearch_elasticsearch app
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ app:enable fulltextsearch_elasticsearch"
        chdir: /var/www/html
      register: occ_enable_elasticsearch
      failed_when: false
      changed_when: true

    - name: Install files_fulltextsearch app
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ app:install files_fulltextsearch"
        chdir: /var/www/html
      register: occ_install_files_fulltextsearch
      failed_when: false
      changed_when: "'installed' in occ_install_files_fulltextsearch.stdout or 'enabled' in occ_install_files_fulltextsearch.stdout"

    - name: Enable files_fulltextsearch app
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ app:enable files_fulltextsearch"
        chdir: /var/www/html
      register: occ_enable_files_fulltextsearch
      failed_when: false
      changed_when: true

    - name: Set search platform config
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ config:app:set fulltextsearch search_platform --value=\"OCA\\\\FullTextSearch_Elasticsearch\\\\Platform\\\\ElasticSearchPlatform\""
        chdir: /var/www/html
      register: occ_set_platform
      changed_when: "'now' in occ_set_platform.stdout or 'Set' in occ_set_platform.stdout"

    - name: Set elasticsearch host config
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ config:app:set fulltextsearch_elasticsearch elastic_host --value=\"http://elasticsearch:9200\""
        chdir: /var/www/html
      register: occ_set_es_host
      changed_when: "'now' in occ_set_es_host.stdout or 'Set' in occ_set_es_host.stdout"

    - name: Set elasticsearch index config
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ config:app:set fulltextsearch_elasticsearch elastic_index --value=\"nextcloud\""
        chdir: /var/www/html
      register: occ_set_es_index
      changed_when: "'now' in occ_set_es_index.stdout or 'Set' in occ_set_es_index.stdout"

    - name: Test fulltextsearch configuration
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ fulltextsearch:test"
        chdir: /var/www/html
      register: occ_fulltextsearch_test
      failed_when: false
      changed_when: false

    - name: Show fulltextsearch test results
      ansible.builtin.debug:
        msg: "{{ occ_fulltextsearch_test.stdout }}"

    - name: Index all documents with fulltextsearch
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ fulltextsearch:index --no-readline"
        chdir: /var/www/html
      register: occ_fulltextsearch_index
      failed_when: false
      changed_when: true

    - name: Show indexing results
      ansible.builtin.debug:
        msg: "Fulltextsearch indexing completed. Check Nextcloud UI for search functionality."

    - name: Configure Elasticsearch highlight max offset
      ansible.builtin.shell:
        command: |
          docker exec nextcloud_elasticsearch curl -s -XPUT 'localhost:9200/nextcloud/_settings' -H 'Content-Type: application/json' -d '{"index":{"highlight.max_analyzed_offset":999999}}'
      failed_when: false
      changed_when: false

    - name: Configure Elasticsearch replicas for single-node cluster
      ansible.builtin.shell:
        command: |
          docker exec nextcloud_elasticsearch curl -s -XPUT 'localhost:9200/nextcloud/_settings' -H 'Content-Type: application/json' -d '{"index":{"number_of_replicas":0}}'
      failed_when: false
      changed_when: false

    - name: Reset fulltextsearch index to clear stale file references
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ fulltextsearch:reset --no-readline"
        chdir: /var/www/html
      register: occ_fulltextsearch_reset
      failed_when: false
      changed_when: true

    - name: Re-index documents after fulltextsearch reset
      when: "nextcloud_container_id is defined and nextcloud_container_id | length | int > 0"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container_id }}"
        command: "php occ fulltextsearch:index --no-readline"
        chdir: /var/www/html
      register: occ_fulltextsearch_reindex
      failed_when: false
      changed_when: true

    - name: Notify completion
      ansible.builtin.shell:
        cmd: "curl -s --max-time 10 -u {{ NTFY_ABORGARDT_USER }}:{{ NTFY_ABORGARDT_PASSWORD }} -H 'Title: Nextcloud Setup Complete' -H 'Tags: white_check_mark' -d 'Nextcloud playbook completed successfully on {{ inventory_hostname }}' https://{{ NTFY_HOST }}/{{ NTFY_TOPIC_ANSIBLE }}"
      register: ntfy_result
      failed_when: false
      changed_when: false
      delegate_to: localhost
      become: false
